# CRNN family (hyperparameters copied verbatim from
# github.com/mic7ch1/ManchuAI-OCR — the prior crnn-base run that
# is published as mic7ch/manchu-ocr-crnn-base on HF).
# All four data variants (step1-syn / step1-real / mix / final) share
# the same architecture + optimizer settings to isolate the effect of
# training-data composition (parallel to the VLM family setup).
crnn-step1-syn: &crnn-base
  training:
    # CTC input. false = recipe used for all reported CRNN runs (raw output-layer
    # activations passed to CTCLoss); true = log_softmax applied before CTCLoss.
    ctc_log_softmax: false
    num_train_epochs: 100
    input_height: 64
    input_width: 480
    batch_size: 16
    num_workers: 4
    learning_rate: 1.0e-3
    hidden_size: 256
    dropout: 0.3
    max_text_length: 64
    save_every_n_epochs: 1
    display_every_n_steps: 100
    warmup_epochs: 5
    mixed_precision: true
    optimizer:
      type: "AdamW"
      lr: 1.0e-3
      betas: [0.9, 0.999]
      weight_decay: 0.05
      eps: 1.0e-8
    scheduler:
      type: "CosineAnnealingWarmRestarts"
      T_0: 10
      T_mult: 2
      eta_min: 1.0e-6
      last_epoch: -1
    gradient_clipping:
      max_norm: 1.0

crnn-step1-real: *crnn-base
crnn-mix: *crnn-base
crnn-final: *crnn-base
