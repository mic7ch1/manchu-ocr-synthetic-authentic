# Default configuration is required and will be loaded first. Model-specific configurations will override default settings when provided.
#
# IMPORTANT — actual canonical training used the following CLI overrides:
#   --bf16 --grad_accum 1
# Which means effective batch = 4 ranks × per_device_train_batch_size (4) × grad_accum (1) = 16.
# The defaults below have been set to match — any consumer running `python scripts/train.py`
# will reproduce the published runs without needing to remember to pass --bf16 / --grad_accum.
default:
  training:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 1
    warmup_steps: 100
    num_train_epochs: 6
    learning_rate: 2.0e-4
    eval_strategy: "no"
    eval_steps: 1000
    fp16: false
    bf16: true
    logging_steps: 100
    optim: "paged_adamw_8bit"
    weight_decay: 0.01
    lr_scheduler_type: "cosine_with_restarts"
    seed: 3407
    remove_unused_columns: false
    dataset_text_field: ""
    report_to: tensorboard
    logging_dir: "logs"
    dataset_kwargs:
      skip_prepare_dataset: true
    dataset_num_proc: 8
    dataloader_num_workers: 4
    max_seq_length: 1536
    load_best_model_at_end: false
    save_strategy: "steps"
    save_steps: 500
    save_total_limit: 50  # was 10 — increased to preserve every save for post-hoc val selection
    metric_for_best_model: "manchu_cer"
    greater_is_better: false

  loading:
    load_in_4bit: true
    load_in_8bit: false
    use_gradient_checkpointing: unsloth
    attn_implementation: eager

  peft:
    finetune_vision_layers: true
    finetune_language_layers: true
    finetune_attention_modules: true
    finetune_mlp_modules: true
    r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    bias: "none"
    random_state: 3407
    use_rslora: false
    use_gradient_checkpointing: false
    loftq_config: null
    target_modules:
      [
        "q_proj",
        "k_proj",
        "v_proj",
        "o_proj",
        "gate_proj",
        "up_proj",
        "down_proj",
      ]

